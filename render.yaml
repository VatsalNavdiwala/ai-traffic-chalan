services:
  - type: web
    name: ai-traffic-challan-api
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn traffic_ai.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE
        value: cpu
      - key: APP_ENV
        value: production
