[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-ai"
version = "0.1.0"
description = "AI Traffic Signal — detection, tracking, signal optimization, violations, challan"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "supervision>=0.25.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.14.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "orjson>=3.10.0",
    "shapely>=2.0.6",
]

[project.scripts]
traffic-pipeline = "traffic_ai.ai.pipeline:main"

[tool.setuptools.packages.find]
include = ["traffic_ai*"]
